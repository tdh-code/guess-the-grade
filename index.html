<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess The Grade · Thomas de Hemptinne</title>
<meta name="description" content="Devine le film à partir de sa palette de couleurs. Un jeu de Thomas de Hemptinne, étalonneur à Bruxelles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111112;--panel:#1c1c1d;--line:#2e2e30;--line2:#3a3a3c;
  --text:#ececef;--muted:#8a8a8a;--soft:#d6d5d0;--accent:#e08a68;
  --good:#7fd39a;--bad:#ff6a5a;
  --grad:linear-gradient(90deg,transparent 0%,#5ff2e6 8%,#4f9dff 20%,#8b5cf6 34%,#e03fd0 50%,#ff3d6e 64%,#ff6a2b 77%,#ffb020 88%,#ffe45c 94%,transparent 100%);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:920px;margin:0 auto;padding:28px clamp(18px,4vw,40px) 60px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.brand{font-weight:600;font-size:18px;letter-spacing:.02em;text-decoration:none;text-transform:uppercase}
.brand small{display:block;font-size:10px;letter-spacing:.35em;color:var(--muted);font-weight:400;margin-top:2px}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.line{position:relative;height:2px;margin:26px 0;overflow:hidden}
.line::before{content:"";position:absolute;inset:0;background:var(--grad) no-repeat;background-size:50% 100%;animation:mv 10s linear infinite}
@keyframes mv{from{background-position:-100% 0}to{background-position:200% 0}}
.btn{display:inline-block;padding:13px 22px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);color:var(--accent);font:600 12px/1.2 Poppins,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s}
.btn:hover{background:#262628;border-color:#55555a}
.btn.ghost{color:var(--soft)}
.btn:disabled{opacity:.4;cursor:default}
h1{font-size:clamp(32px,5.5vw,64px);line-height:1.02;font-weight:700;letter-spacing:-.03em;margin:0 0 18px;color:#f4f2ee}
p.lead{font-size:16px;line-height:1.75;color:var(--soft);max-width:560px;margin:0 0 28px}
.screen{display:none;flex:1}
.screen.on{display:block}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-bottom:14px}
.hud b{color:var(--text);font-weight:600}
.timer{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.palette{display:flex;height:clamp(150px,30vw,260px);border-radius:10px;overflow:hidden;margin-bottom:26px;box-shadow:0 0 0 1px var(--line)}
.palette span{display:block;height:100%;transition:flex-grow .6s}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.choice{padding:16px 18px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--text);font:500 15px/1.35 Poppins,sans-serif;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover:not(:disabled){border-color:#55555a;background:#232325}
.choice.good{border-color:var(--good);background:rgba(127,211,154,.1)}
.choice.bad{border-color:var(--bad);background:rgba(255,106,90,.1)}
.choice:disabled{cursor:default}
.feedback{min-height:28px;margin-top:16px;font-size:14px;color:var(--soft)}
.big{font-size:clamp(56px,10vw,110px);font-weight:700;letter-spacing:-.04em;line-height:1;margin:6px 0 10px;color:#f4f2ee}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{flex:1;min-width:200px;padding:13px 16px;border-radius:6px;border:1px solid var(--line2);background:#0c0c0d;color:var(--text);font:500 15px Poppins,sans-serif}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
.board{margin-top:30px;border-top:1px solid var(--line)}
.board ol{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:42px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.board li .r{color:var(--muted)}
.board li .s{font-weight:600}
.board li.me{color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
footer{margin-top:40px;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);text-align:center}
footer a{text-decoration:none}
@media (prefers-reduced-motion:reduce){.line::before{animation:none;background-position:50% 0}.timer i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="https://thomasdehemptinne.com/">Thomas de Hemptinne<small>Colorist</small></a>
    <span class="kicker">Guess The Grade</span>
  </header>
  <div class="line"></div>

  <!-- Jeu -->
  <section class="screen on" id="s-game">
    <div class="hud"><span>Palette <b id="hRound">1</b>/<span id="hTotal">10</span></span><span>Série <b id="hStreak">0</b></span><span>Score <b id="hScore">0</b></span></div>
    <div class="timer"><i id="bar"></i></div>
    <div class="palette" id="pal" role="img" aria-label="Palette de couleurs du film à deviner"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
  </section>

  <!-- Fin -->
  <section class="screen" id="s-end">
    <p class="kicker" style="margin:0">Ton score</p>
    <div class="big" id="final">0</div>
    <p class="lead" id="summary" style="margin-bottom:22px"></p>
    <form id="saveForm" class="row" autocomplete="off">
      <input type="text" id="name" maxlength="20" placeholder="Ton nom ou pseudo" aria-label="Ton nom">
      <button class="btn" type="submit" id="saveBtn">Enregistrer</button>
    </form>
    <div class="err" id="err"></div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="again">Rejouer</button></div>
    <div class="board" id="endBoard"><p class="kicker" style="margin:20px 0 6px">Top 10</p><ol></ol><p class="note" id="boardNote"></p></div>
  </section>

  <footer><a href="https://thomasdehemptinne.com/">thomasdehemptinne.com</a></footer>
</div>

<script src="palettes.js"></script>
<script>
/* ===== Réglages ===== */
const CONFIG = {
  ROUNDS: 10,            // palettes par partie
  SECONDS: 20,           // temps par palette
  // Classement en ligne : remplis ces deux valeurs avec ton projet Supabase.
  // Laissés vides, le jeu garde un classement de démo dans ce navigateur.
  SUPABASE_URL: "",
  SUPABASE_ANON_KEY: ""
};

const $ = s => document.querySelector(s);
const films = (window.CP_FILMS || []).filter(f => f.colors && f.colors.length);
const ROUNDS = Math.min(CONFIG.ROUNDS, films.length);
$("#hTotal").textContent = ROUNDS;

/* ===== Classement (Supabase ou démo locale) ===== */
const online = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
const LS = "cp_demo_scores";
const board = {
  async top(n = 10) {
    if (online) {
      const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/scores?select=name,score,created_at&order=score.desc,created_at.asc&limit=${n}`,
        { headers: { apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: `Bearer ${CONFIG.SUPABASE_ANON_KEY}` } });
      if (!r.ok) throw new Error("load");
      return r.json();
    }
    let rows = []; try { rows = JSON.parse(localStorage.getItem(LS) || "[]"); } catch (e) {}
    return rows.sort((a, b) => b.score - a.score || a.created_at.localeCompare(b.created_at)).slice(0, n);
  },
  async add(name, score) {
    const row = { name, score };
    if (online) {
      const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/scores`, { method: "POST",
        headers: { apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: `Bearer ${CONFIG.SUPABASE_ANON_KEY}`, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify(row) });
      if (!r.ok) throw new Error("save");
      return;
    }
    try { const rows = JSON.parse(localStorage.getItem(LS) || "[]"); rows.push({ ...row, created_at: new Date().toISOString() }); localStorage.setItem(LS, JSON.stringify(rows)); } catch (e) {}
  }
};

function renderBoard(el, rows, me) {
  const ol = el.querySelector("ol"); ol.textContent = "";
  if (!rows.length) { const li = document.createElement("li"); li.innerHTML = '<span class="r">–</span><span>Aucun score pour l’instant. Sois le premier !</span><span></span>'; ol.append(li); return; }
  rows.forEach((r, i) => {
    const li = document.createElement("li");
    if (me && r.name === me.name && r.score === me.score) li.className = "me";
    const a = document.createElement("span"); a.className = "r"; a.textContent = i + 1;
    const b = document.createElement("span"); b.textContent = r.name;
    const c = document.createElement("span"); c.className = "s"; c.textContent = r.score;
    li.append(a, b, c); ol.append(li);
  });
}
async function loadBoard(el, me) {
  try { renderBoard(el, await board.top(10), me); }
  catch (e) { el.querySelector("ol").innerHTML = '<li><span class="r">!</span><span>Classement indisponible pour le moment.</span><span></span></li>'; }
  const note = el.querySelector(".note"); if (note) note.textContent = online ? "" : "Classement de démonstration : enregistré seulement dans ce navigateur.";
}

/* ===== Jeu ===== */
let order = [], round = 0, score = 0, streak = 0, correct = 0, t0 = 0, raf = 0, locked = false;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }

function start() {
  order = shuffle(films).slice(0, ROUNDS); round = 0; score = 0; streak = 0; correct = 0;
  $("#hScore").textContent = 0; $("#hStreak").textContent = 0;
  show("s-game"); next();
}
function next() {
  locked = false; const f = order[round];
  $("#hRound").textContent = round + 1; $("#fb").textContent = "";
  const pal = $("#pal"); pal.textContent = "";
  f.colors.forEach((c, i) => { const s = document.createElement("span"); s.style.background = c; s.style.flexGrow = (f.weights && f.weights[i]) || 1; s.title = c; pal.append(s); });
  const others = shuffle(films.filter(x => x !== f)).slice(0, 3);
  const box = $("#choices"); box.textContent = "";
  shuffle([f, ...others]).forEach(o => { const b = document.createElement("button"); b.className = "choice"; b.textContent = o.title; b.onclick = () => answer(o === f, b, f); box.append(b); });
  t0 = performance.now(); tick();
}
function tick() {
  const left = Math.max(0, CONFIG.SECONDS - (performance.now() - t0) / 1000);
  $("#bar").style.transform = `scaleX(${left / CONFIG.SECONDS})`;
  if (left <= 0) return answer(false, null, order[round], true);
  raf = requestAnimationFrame(tick);
}
function answer(ok, btn, film, timeout) {
  if (locked) return; locked = true; cancelAnimationFrame(raf);
  const left = Math.max(0, CONFIG.SECONDS - (performance.now() - t0) / 1000);
  document.querySelectorAll(".choice").forEach(b => { b.disabled = true; if (b.textContent === film.title) b.classList.add("good"); });
  if (ok) {
    streak++; correct++;
    const pts = 100 + Math.round(left * 10) + (streak >= 2 ? (streak - 1) * 25 : 0);
    score += pts; $("#fb").textContent = `Bien vu ! +${pts} points` + (streak >= 2 ? ` (série ×${streak})` : "");
  } else {
    streak = 0; if (btn) btn.classList.add("bad");
    $("#fb").textContent = (timeout ? "Temps écoulé. " : "Raté. ") + `C’était « ${film.title} ».`;
  }
  $("#hScore").textContent = score; $("#hStreak").textContent = streak;
  setTimeout(() => { round++; round < ROUNDS ? next() : end(); }, ok ? 1100 : 1900);
}
function end() {
  show("s-end"); $("#final").textContent = score;
  $("#summary").textContent = `${correct} bonne${correct > 1 ? "s" : ""} réponse${correct > 1 ? "s" : ""} sur ${ROUNDS}. Laisse ton nom pour entrer au classement.`;
  $("#saveForm").hidden = false; $("#saveBtn").disabled = false; $("#err").textContent = "";
  try { $("#name").value = localStorage.getItem("cp_name") || ""; } catch (e) {}
  loadBoard($("#endBoard"));
}

$("#saveForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("#name").value.trim().replace(/\s+/g, " ");
  if (!name) { $("#err").textContent = "Entre un nom ou un pseudo."; return; }
  if (name.length > 20) { $("#err").textContent = "20 caractères maximum."; return; }
  $("#err").textContent = ""; $("#saveBtn").disabled = true;
  try {
    await board.add(name, score);
    try { localStorage.setItem("cp_name", name); } catch (e) {}
    $("#saveForm").hidden = true; $("#summary").textContent = "Score enregistré !";
    loadBoard($("#endBoard"), { name, score });
  } catch (err) { $("#saveBtn").disabled = false; $("#err").textContent = "Impossible d’enregistrer pour le moment. Réessaie."; }
});
$("#name").addEventListener("input", () => { $("#err").textContent = ""; });
$("#again").onclick = start;
if (films.length < 4) { $("#fb").textContent = "Ajoute au moins 4 films dans palettes.js."; } else { start(); }
</script>
</body>
</html>
